name: Build Android (APK + AAB)

# ============================================================
#  GitHub Secrets ط§ظ„ظ…ط·ظ„ظˆط¨ط©:
#    API_BASE_URL              -> ط±ط§ط¨ط· ط§ظ„ظ€ API ط¹ظ„ظ‰ Vercel (ط¨ط¯ظˆظ† / ظپظٹ ط§ظ„ظ†ظ‡ط§ظٹط©)
#    ADMOB_BANNER_ID           -> (ط¥ظ†طھط§ط¬) ظ…ط¹ط±ظ‘ظپ ط§ظ„ط¨ط§ظ†ط± â€” ط§ط®طھظٹط§ط±ظٹ
#    ADMOB_INTERSTITIAL_ID     -> (ط¥ظ†طھط§ط¬) ظ…ط¹ط±ظ‘ظپ ط§ظ„ط¨ظٹظ†ظٹ â€” ط§ط®طھظٹط§ط±ظٹ
#    KEYSTORE_BASE64           -> base64 -w0 keystore.jks
#    KEYSTORE_PASSWORD         -> ظƒظ„ظ…ط© ط³ط± ط§ظ„ظ€ keystore
#    KEY_ALIAS                 -> ط§ط³ظ… ط§ظ„ظ€ alias
#    KEY_PASSWORD              -> ظƒظ„ظ…ط© ط³ط± ط§ظ„ظ€ alias
# ============================================================

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      # 1) ط³ط­ط¨ ط§ظ„ظƒظˆط¯
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) طھط¬ظ‡ظٹط² Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3) Java + Android SDK (ظ…ط·ظ„ظˆط¨ط§ظ† ظ„ظ€ Gradle)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4) طھط«ط¨ظٹطھ ط§ظ„ط§ط¹طھظ…ط§ط¯ظٹط§طھ + Capacitor CLI/Android platform
      - name: Install dependencies
        run: |
          npm ci
          npm install --save-dev @capacitor/cli @capacitor/android

      # 4ط¨) Static Export ظ„ط§ ظٹط¯ط¹ظ… Route Handlers â€” ظ†ظ†ظ‚ظ„ظ‡ط§ ظ…ط¤ظ‚طھط§ظ‹ ط®ط§ط±ط¬ ط§ظ„ط´ط¬ط±ط©
      - name: Move API routes out of the static build
        run: mv src/app/api /tmp/api-routes-backup

      # 5) ط¨ظ†ط§ط، ظ…ظ„ظپط§طھ ط§ظ„ظˆظٹط¨ ط§ظ„ط«ط§ط¨طھط© (out/) ظ…ط¹ ط­ظ‚ظ† ط±ط§ط¨ط· ط§ظ„ظ€ API ظˆظ‚طھ ط§ظ„ط¨ظ†ط§ط،
      - name: Build web static files
        env:
          CAPACITOR_BUILD: "true"
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          NEXT_PUBLIC_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: npm run build

      # 6) ط¥ظ†ط´ط§ط، ظ…ط´ط±ظˆط¹ ط£ظ†ط¯ط±ظˆظٹط¯ (ط£ظˆظ„ ظ…ط±ط©) ط«ظ… ظ…ط²ط§ظ…ظ†ط© out/ ط¨ط¯ط§ط®ظ„ظ‡
      - name: Add Android platform (first run only)
        run: test -d android || npx cap add android

      - name: Capacitor sync
        run: npx cap sync android

      # 7) طھط¬ظ‡ظٹط² ط§ظ„طھظˆظ‚ظٹط¹ ظ…ظ† ط§ظ„ظ€ Secrets
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          cat > android/app/keystore.properties <<'EOF'
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Inject release signing config
        run: |
          cat >> android/app/build.gradle <<'EOF'

          // ---- CI Release Signing (injected by GitHub Actions) ----
          def keystorePropertiesFile = rootProject.file("app/keystore.properties")
          if (keystorePropertiesFile.exists()) {
              def keystoreProperties = new Properties()
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
              android {
                  signingConfigs {
                      release {
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                      }
                  }
                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                      }
                  }
              }
          }
          EOF

      # 8) ط¨ظ†ط§ط، APK + AAB (ط§ظ„ظ€ AAB ط¥ظ„ط²ط§ظ…ظٹ ظ„ظ€ Google Play)
      - name: Grant Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Release AAB (Google Play)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      # 9) ط±ظپط¹ ط§ظ„ظ†ظˆط§طھط¬ ظƒظ€ Artifacts
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toksaver-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact (ظ„ظ„ظ†ط´ط± ط¹ظ„ظ‰ Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: toksaver-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
