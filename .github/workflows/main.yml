name: Build Android APK (Juzur - TokSaver)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

    - name: Build Web App & Capacitor Sync
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}
        API_URL: ${{ secrets.API_URL }}
        DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://postgres:postgres@localhost:5432/postgres' }}
      run: |
        npm run build
        
        if [ ! -d "out" ]; then
          echo "Creating 'out' directory for Capacitor..."
          mkdir -p out
          cp -r public/* out/ 2>/dev/null || true
          mkdir -p out/_next
          cp -r .next/static out/_next/ 2>/dev/null || true
          find .next -name "*.html" -exec cp {} out/ \; 2>/dev/null || true
        fi

        npx cap add android || true
        npx cap sync android

    - name: Build Android Debug APK
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -Dorg.gradle.daemon=false"
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Juzur-TokSaver-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
